<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/station.css}" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon" />
        <h1>ACCESS</h1>
      </div>
      <nav class="header-right">
        <a th:href="@{/admin}">HOME</a>
        <a th:href="@{/route}">ROUTE</a>
        <a th:href="@{/train}">TRAIN</a>
        <a th:href="@{/schedule}">SCHEDULE</a>
        <a th:href="@{/tiketAll}">TICKET</a>
        <div class="nav-icon-group">
          <img th:src="@{/aset/profile.png}" alt="profile" />
          <a th:href="@{/profile/admin}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
          <img th:src="@{/aset/logout.png}" alt="logout" />
          <a th:href="@{/}">LOGOUT</a>
        </div>
      </nav>
    </header>

    <main class="station-container">
      <h1 class="page-title">STATION</h1>
      <hr class="header-line" />

      <section class="form-wrapper">
        <form
          th:action="${mode == 'update'} ? @{/station/update/{id}(id=${station.id})} : @{/station}"
          method="post"
          th:object="${station}"
        >
          <input type="hidden" th:field="*{id}" />

          <div class="form-group">
            <label>NAMA STATION :</label>
            <input type="text" th:field="*{stationName}" minlength="3" maxlength="30" required />
          </div>
          <div class="form-group">
            <label>CODE STATION :</label>
            <input type="text" th:field="*{stationCode}" minlength="3" maxlength="5" required/>
          </div>
          <div class="form-group">
            <label>CITY :</label>
            <input type="text" th:field="*{city}" minlength="3" maxlength="50" required/>
          </div>
          <div class="form-group">
            <label>ACTIVE :</label>
            <select th:field="*{active}" required class="small-input">
              <option th:value="true">Active</option>
              <option th:value="false">Tidak</option>
            </select>
          </div>

          <div class="form-error-wrapper">
            <p th:if="${error}" th:text="${error}" class="error-message"></p>
          </div>

          <div class="form-action">
            <button type="submit" class="btn-save">SAVE</button>
          </div>
        </form>
      </section>

      <section class="list-wrapper">
        <div th:each="stCity : ${stationByCity}">
          <h2 class="city-title" th:text="${stCity.key}">CITY</h2>
          <hr class="city-line" />

          <div class="grid-container">
            <div th:each="s : ${stCity.value}" class="station-card">
              <p>
                <strong>NAMA STATION :</strong>
                <span th:text="${s.stationName}"></span>
              </p>
              <p>
                <strong>CODE STATION :</strong>
                <span th:text="${s.stationCode}"></span>
              </p>
              <p>
                <strong>ACTIVE :</strong>
                <span th:text="${s.active ? 'Yes' : 'No'}"></span>
              </p>
              <div class="card-actions">
                <a
                  th:href="@{'/station/update/' + ${s.id}}"
                  class="action-update"
                  >UPDATE</a
                >
                <a th:href="@{'/station/' + ${s.id}}" class="action-delete"
                  >DELETE</a
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <h3>CONTACT US</h3>
      <img th:src="@{/aset/github.png}" alt="github" />
      <img th:src="@{/aset/ig.png}" alt="ig" />
      <img th:src="@{/aset/wa.png}" alt="wa" />
    </footer>
  </body>
</html>
