<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile User</title>

    <link rel="stylesheet" th:href="@{/css/profileAdmin.css}">

    <script>
        function toggleUpdateForm() {
            const form = document.getElementById("updateForm");
            form.style.display = (form.style.display === "none") ? "block" : "none";
        }
    </script>
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
        <h1>ACCESS</h1>
    </div>
    <nav class="header-right">
        <a th:href="@{/admin}">HOME</a>
        <a th:href="@{/station}">STATION</a>
        <a th:href="@{/route}">ROUTE</a>
        <a th:href="@{/train}">TRAIN</a>
        <a th:href="@{/schedule}">SCHEDULE</a>
        <a th:href="@{/tiketAll}">TICKET</a>
        <div class="nav-icon-group">
            <img th:src="@{/aset/profile.png}" alt="profile">
            <a th:href="@{/profile/admin}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
            <img th:src="@{/aset/logout.png}" alt="logout">
            <a th:href="@{/}">LOGOUT</a>
        </div>
    </nav>
</header>

<main class="main-container">
    <section class="profile-view">
        <h2 class="section-title">PROFILE</h2>
        <hr class="header-line">
        
        <div class="profile-details">
            <div class="detail-row">
                <span class="label">NAMA</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.name}"></span>
            </div>
            <div class="detail-row">
                <span class="label">EMAIL</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.email}"></span>
            </div>
            <div class="detail-row">
                <span class="label">PASSWORD</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.password}"></span>
            </div>
            <div class="detail-row">
                <span class="label">BALANCE</span>
                <span class="colon">: Rp</span>
                <span class="value" th:text="${user.balance}"></span>
            </div>
        </div>

        <div class="action-center">
            <button class="btn-main" onclick="toggleUpdateForm()">UPDATE PROFILE</button>
        </div>
    </section>

    <section id="updateForm" class="profile-update" style="display:none;">
        <h2 class="section-title">UPDATE PROFILE</h2>
        <hr class="header-line">

        <form th:action="@{/profile/admin/update}" method="post">
            <input type="hidden" name="id" th:value="${user.id}">
            
            <div class="form-group">
                <label>NAMA</label>
                <span class="colon">:</span>
                <input type="text" name="name" th:value="${user.name}" minlength="3" maxlength="30" required>
            </div>
            
            <div class="form-group">
                <label>EMAIL</label>
                <span class="colon">:</span>
                <input type="email" name="email" th:value="${user.email}" minlength="15" maxlength="30" required>
            </div>

            <div class="form-group">
                <label>PASSWORD</label>
                <span class="colon">:</span>
                <input type="text" name="password" th:value="${user.password}" minlength="6" maxlength="20" required>
            </div>

            <input type="hidden" name="balance" th:value="${user.balance}">
            <input type="hidden" name="role" th:value="${user.role}">

            <div class="form-actions-row">
                <button type="submit" class="btn-save">UPDATE</button>
                <button type="button" class="btn-cancel" onclick="toggleUpdateForm()">CANCEL</button>
            </div>
        </form>
    </section>
</main>
  <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>
</body>
</html>
