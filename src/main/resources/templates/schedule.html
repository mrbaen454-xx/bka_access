<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/schedule.css}">
  </head>
  <body>
   <header class="site-header">
    <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
        <h1>BKA ACCESS</h1>
    </div>
    <nav class="header-right">
        <a th:href="@{/admin}">HOME</a>
        <a th:href="@{/station}">STATION</a>
        <a th:href="@{/route}">ROUTE</a>
        <a th:href="@{/train}">TRAIN</a>
        <div class="nav-icon-group">
            <img th:src="@{/aset/profile.png}" alt="profile">
            <a th:href="@{/profile/admin}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
            <img th:src="@{/aset/logout.png}" alt="logout">
            <a th:href="@{/}">LOGOUT</a>
        </div>
    </nav>
</header>

<main class="main-container">
    <h1 class="page-title">SCHEDULE</h1>
    <hr class="header-line">

    <section class="form-wrapper">
        <form th:action="${mode == 'update'}? @{/schedule/update/{id}(id=${schedule.id})} : @{/schedule}" th:object="${schedule}" method="post">
            <div class="form-group">
                <label>PILIH ROUTE :</label>
                <select th:field="*{route}" required>
                    <option value="">-- Pilih Route --</option>
                    <option th:each="r : ${routes}" th:value="${r.id}" 
                            th:text="${r.departureStation.stationName} + ' - ' + ${r.arrivalStation.stationName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>PILIH TRAIN :</label>
                <select th:field="*{train}" required>
                    <option value="">-- Pilih Train --</option>
                    <option th:each="t : ${trains}" th:value="${t.id}" 
                            th:text="${t.trainName} + ' (' + ${t.trainCode} + ')'"></option>
                </select>
            </div>

            <div class="form-group">
                <label>DEPARTURE TIME :</label>
                <input type="datetime-local" th:field="*{departureTime}" required />
            </div>

            <div class="form-group">
                <label>ARRIVAL TIME :</label>
                <input type="datetime-local" th:field="*{arrivalTime}" required />
            </div>

            <div class="error-container" th:if="${error}">
                <p class="error-text" th:text="${error}"></p>
            </div>

            <div class="form-action">
                <button type="submit" class="btn-save">SAVE</button>
            </div>
        </form>
    </section>

    <section class="list-wrapper">
        <div class="grid-container">
            <div th:each="s : ${schedules}" class="schedule-card">
                <div class="route-display">
                    <span th:text="${s.route.departureStation.stationName}"></span>
                    <span class="connector-line"></span>
                    <span th:text="${s.route.arrivalStation.stationName}"></span>
                </div>
                
                <p class="train-display" th:text="${s.train.trainName + ' (' + s.train.trainCode + ')'}"></p>
                
                <div class="time-display">
                    <span th:text="${#temporals.format(s.departureTime, 'dd MMM yyyy HH:mm')}"></span>
                    <span class="connector-line"></span>
                    <span th:text="${#temporals.format(s.arrivalTime, 'dd MMM yyyy HH:mm')}"></span>
                </div>

                <div class="card-actions">
                    <a th:href="@{'/schedule/update/' + ${s.id}}">UPDATE</a>
                    <a th:href="@{'/schedule/delete/' + ${s.id}}">DELETE</a>
                </div>
            </div>
        </div>
    </section>
</main>
      <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>
  </body>
</html>
