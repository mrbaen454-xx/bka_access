<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile User</title>

    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <script>
        function toggleUpdateForm() {
            const form = document.getElementById("updateForm");
            form.style.display = (form.style.display === "none") ? "block" : "none";
        }
    </script>
</head>
<body>

   <header class="site-header">
        <div class="header-left">
            <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
            <h1>ACCESS</h1>
        </div>
        <nav class="header-right">
             <a th:href="@{/user}">HOME</a>
            <a th:href="@{/ticket}">TICKET</a>
            <div class="nav-icon-group">
                <img th:src="@{/aset/profile.png}" alt="profile">
                <a th:href="@{/profile}">PROFILE</a>
            </div>
            <div class="nav-icon-group">
                <img th:src="@{/aset/logout.png}" alt="logout">
                <a th:href="@{/}">LOGOUT</a>
            </div>
        </nav>
    </header>

<main class="main-container">
    <section class="profile-section">
        <h2 class="section-title">PROFILE</h2>
        <hr class="header-line">
        
        <div class="info-grid">
            <div class="info-row">
                <span class="label">NAMA</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.name}"></span>
            </div>
            <div class="info-row">
                <span class="label">EMAIL</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.email}"></span>
            </div>
            <div class="info-row">
                <span class="label">PASSWORD</span>
                <span class="colon">:</span>
                <span class="value" th:text="${user.password}"></span>
            </div>
            <div class="info-row">
                <span class="label">BALANCE</span>
                <span class="colon">: Rp</span>
                <span class="value" th:text="${user.balance}"></span>
            </div>
        </div>
        
        <div class="action-right">
            <button class="btn-gray" onclick="toggleUpdateForm()">UPDATE PROFILE</button>
        </div>
    </section>

    <section class="topup-section">
        <hr class="header-line">
        <form th:action="@{/topUp}" method="post" class="topup-form">
            <h2 class="section-title">TOP UP BALANCE :</h2>
            <input type="number" name="amount" min="1000" step="1000" class="input-field-topup" required />
            <button type="submit" class="btn-gray">TOP UP</button>
        </form>
    </section>

    <section id="updateForm" class="update-section" style="display:none;">
        <h2 class="section-title">UPDATE PROFILE</h2>
        <hr class="header-line">
        
        <form th:action="@{/profile/update}" method="post">
            <input type="hidden" name="id" th:value="${user.id}">
            
            <div class="info-grid">
                <div class="info-row">
                    <span class="label">NAMA</span>
                    <span class="colon">:</span>
                    <input type="text" name="name" th:value="${user.name}" class="input-field" required>
                </div>
                <div class="info-row">
                    <span class="label">EMAIL</span>
                    <span class="colon">:</span>
                    <input type="email" name="email" th:value="${user.email}" class="input-field" required>
                </div>
                <div class="info-row">
                    <span class="label">PASSWORD</span>
                    <span class="colon">:</span>
                    <input type="text" name="password" th:value="${user.password}" class="input-field">
                </div>
            </div>
            
            <div class="action-right">
                <button type="submit" class="btn-gray">UPDATE</button>
                <button type="button" class="btn-cancel" onclick="toggleUpdateForm()">CANCEL</button>
            </div>
        </form>
    </section>
</main>
 <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>

</body>
</html>
