<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/train.css}">
  </head>
  <body>
   <header class="site-header">
    <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
        <h1>ACCESS</h1>
    </div>
    <nav class="header-right">
        <a th:href="@{/admin}">HOME</a>
        <a th:href="@{/station}">STATION</a>
        <a th:href="@{/route}">ROUTE</a>
        <a th:href="@{/schedule}">SCHEDULE</a>
        <a th:href="@{/tiketAll}">TICKET</a>
        <div class="nav-icon-group">
            <img th:src="@{/aset/profile.png}" alt="profile">
            <a th:href="@{/profile/admin}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
            <img th:src="@{/aset/logout.png}" alt="logout">
            <a th:href="@{/}">LOGOUT</a>
        </div>
    </nav>
</header>

<main class="main-container">
    <h1 class="page-title">TRAIN</h1>
    <hr class="header-line">

    <section class="form-wrapper">
        <form th:action="${mode == 'update'} ? @{/train/update/{id}(id=${train.id})} : @{/train}" method="post" th:object="${train}">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label>TRAIN NAME :</label>
                <input type="text" th:field="*{trainName}" required />
            </div>
            
            <div class="form-group">
                <label>TRAIN CODE :</label>
                <input type="text" th:field="*{trainCode}" required />
            </div>

            <div class="form-group">
                <label>ACTIVE :</label>
                <select th:field="*{active}" class="small-input">
                    <option th:value="true">Active</option>
                    <option th:value="false">Tidak</option>
                </select>
            </div>

            <div class="error-container" th:if="${error}">
                <p class="error-text" th:text="${error}"></p>
            </div>

            <div class="form-action">
                <button type="submit" class="btn-save">SAVE</button>
            </div>
        </form>
    </section>

    <div class="sort-container">
        <a th:href="@{/train(dir=${nextDir})}" class="btn-sort">
            SORT NAME TRAIN 
            <span th:text="${currentDir == 'asc' ? 'A → Z' : 'Z → A'}"></span>
        </a>
    </div>

    <section class="list-wrapper">
        <div class="grid-container">
            <div th:each="train : ${trains}" class="train-card">
                <p><strong>TRAIN NAME (TRAIN CODE) :</strong> <br>
                   <span th:text="${train.trainName} + ' (' + ${train.trainCode} + ')'"></span></p>
                <p><strong>ACTIVE :</strong> <span th:text="${train.active} ? 'Active' : 'Tidak'"></span></p>
                
                <div class="card-actions">
                    <a th:href="@{/carriage/{id}(id=${train.id})}">CARRIAGE</a>
                    <a th:href="@{/train/update/{id}(id=${train.id})}">UPDATE</a>
                    <a th:href="@{'/train/delete/' + ${train.id}}">DELETE</a>
                </div>
            </div>
        </div>
    </section>
</main>
      <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>
  </body>
</html>
