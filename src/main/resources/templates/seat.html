<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/seat.css}">
</head>
<body>
   <header class="site-header">
    <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
        <h1>ACCESS</h1>
    </div>
    <nav class="header-right">
        <a th:href="@{/admin}">HOME</a>
        <a th:href="@{/station}">STATION</a>
        <a th:href="@{/route}">ROUTE</a>
        <a th:href="@{/train}">TRAIN</a>
        <a th:href="@{/schedule}">SCHEDULE</a>
        <a th:href="@{/tiketAll}">TICKET</a>
        <a th:href="@{/carriage/{id}(id=${carriage.train.id})}">CARRIAGE</a>
        <div class="nav-icon-group">
            <img th:src="@{/aset/profile.png}" alt="profile">
            <a th:href="@{/profile/admin}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
            <img th:src="@{/aset/logout.png}" alt="logout">
            <a th:href="@{/}">LOGOUT</a>
        </div>
    </nav>
</header>

<main class="main-container">
    <h1 class="page-title">SEAT</h1>
    <hr class="header-line">

    <section class="carriage-info-wrapper">
        <div class="info-row">
            <label>CARRIAGE NUMBER :</label>
            <span th:text="${carriage.carriageNumber}"></span>
        </div>
        <div class="info-row">
            <label>TYPE :</label>
            <span th:text="${carriage.type}"></span>
        </div>
        <div class="info-row">
            <label>SEAT COUNT :</label>
            <span th:text="${carriage.seatCount}"></span>
        </div>
    </section>

    <hr class="content-divider">

    <section class="seat-grid">
        <div th:each="seat : ${seats}" class="seat-item">
            <span class="seat-label" th:text="${seat.seatNumber}"></span>
        </div>
    </section>
</main>
      <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>
</body>
</html>
