<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/booking.css}">
  </head>
  <body>
<header class="site-header">
    <div class="header-left">
        <img th:src="@{/aset/bka.png}" alt="Logo BKA" class="logo-icon">
        <h1>ACCESS</h1>
    </div>
    <nav class="header-right">
        <a th:href="${booking?.id == null}? @{/user} :
        @{/booking/delete/{id}(id=${booking.id})}">CANCEL</a>
        <a th:href="@{/ticket}">TICKET</a>
        <div class="nav-icon-group">
            <img th:src="@{/aset/profile.png}" alt="profile">
            <a th:href="@{/profile}">PROFILE</a>
        </div>
        <div class="nav-icon-group">
            <img th:src="@{/aset/logout.png}" alt="logout">
            <a th:href="@{/}">LOGOUT</a>
        </div>
    </nav>
</header>

<main class="main-container">
    <h1 class="page-title">BOOKING</h1>
    <hr class="header-line">

    <section class="booking-details">
        <div class="row-display">
            <span class="station-name" th:text="${schedule.route.departureStation.stationName}"></span>
            <span class="connector-line"></span>
            <span class="station-name" th:text="${schedule.route.arrivalStation.stationName}"></span>
        </div>

        <p class="train-info" th:text="${schedule.train.trainName + ' (' + schedule.train.trainCode + ')'}"></p>

        <div class="row-display time-row">
            <span th:text="${schedule.departureTime}"></span>
            <span class="connector-line"></span>
            <span th:text="${schedule.arrivalTime}"></span>
        </div>

        <div class="info-group">
            <div class="info-line">
                <label>PRICE</label>
                <span class="colon">:</span>
                <span th:text="'Rp ' + ${schedule.route.basePrice}"></span>
            </div>
            
            <form th:action="@{/booking/{id}(id=${schedule.id})}" method="post" class="form-next">
                <div class="info-line">
                    <label>TICKET COUNT</label>
                    <span class="colon">:</span>
                    <input type="number" name="ticketCount" min="1" th:value="${ticketCount != null ? ticketCount : 1}" required />
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn-pill">NEXT</button>
                </div>
                <div class="error-container" th:if="${error}">
            <p class="error-text" th:text="${error}"></p>
          </div>
          </form>
        </div>
    </section>

    <hr class="header-line" th:if="${showBuyButton}">

    <section class="total-section" th:if="${showBuyButton}">
        <div class="info-line">
            <label>TOTAL PRICE</label>
            <span class="colon">:</span>
            <span class="total-value" th:text="'Rp ' + ${booking.totalPayment}"></span>
        </div>
        <form th:action="@{/booking/buy}" method="post" class="btn-container">
            <input type="hidden" name="bookingId" th:value="${booking.id}">
            <button type="submit" class="btn-pill">BUY</button>
        </form>
        <p class="error-msg" th:if="${error}" th:text="${error}"></p>
    </section>
</main>

 <footer>
        <h3>CONTACT US</h3>
        <img th:src="@{/aset/github.png}" alt="github">
        <img th:src="@{/aset/ig.png}" alt="ig">
        <img th:src="@{/aset/wa.png}" alt="wa">
    </footer>
  </body>
</html>
